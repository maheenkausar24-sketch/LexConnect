<section class="lexora-widget" data-lexora-root data-lexora-mode="floating" data-csrf-token="{{ csrf_token }}" aria-label="Lexora AI assistant">
    <button class="lexora-fab" data-lexora-toggle type="button" aria-label="Open Lexora AI">
        <span class="lexora-fab-mark">AI</span>
        <span class="lexora-fab-pulse"></span>
    </button>
    <div class="lexora-panel" data-lexora-panel aria-hidden="true">
        <header class="lexora-header">
            <div>
                <span class="lexora-eyebrow">LexConnect assistant</span>
                <h2>Lexora AI</h2>
            </div>
            <button class="lexora-icon-btn" data-lexora-close type="button" aria-label="Close Lexora AI">&times;</button>
        </header>
        <div class="lexora-status" data-lexora-status>Ready to guide your next step</div>
        <div class="lexora-messages" data-lexora-box>
            <div class="lexora-message lexora-message-bot">
                Hi, I am Lexora AI. Describe your issue and I will identify the category, suggest next steps, and recommend lawyers.
            </div>
        </div>
        <div class="lexora-suggestions" data-lexora-suggestions>
            <button type="button" data-lexora-suggestion="Find a lawyer for my legal issue">Find a lawyer</button>
            <button type="button" data-lexora-suggestion="Summarize my issue and suggest next steps">Summarize my issue</button>
            <button type="button" data-lexora-suggestion="I have a property dispute over land or house documents">Property dispute</button>
            <button type="button" data-lexora-suggestion="I need help with a family issue like divorce, custody, or maintenance">Family issue</button>
            <button type="button" data-lexora-suggestion="I need help with cyber crime, hacking, scam, or online fraud">Cyber crime</button>
            <button type="button" data-lexora-suggestion="How do I book a consultation on LexConnect?">Book consultation</button>
            <button type="button" data-lexora-suggestion="What documents should I prepare before meeting a lawyer?">Documents needed</button>
            <button type="button" data-lexora-suggestion="Is my issue urgent and what should I do first?">Urgency check</button>
        </div>
        <form class="lexora-composer" data-lexora-form>
            <button class="lexora-icon-btn" data-lexora-voice type="button" aria-label="Use voice input" hidden>Mic</button>
            <textarea data-lexora-input rows="1" placeholder="Ask Lexora AI..."></textarea>
            <button class="lexora-send" data-lexora-send type="submit" aria-label="Send message">Send</button>
        </form>
    </div>
</section>
