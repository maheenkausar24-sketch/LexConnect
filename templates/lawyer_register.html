<!DOCTYPE html>
<html>

<head>
<title>Lawyer Registration - LexConnect</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#2c3e50,#4ca1af);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:420px;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:25px;
color:#2c3e50;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

button{
width:100%;
padding:12px;
background:#2c3e50;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1a252f;
}

.login-link{
text-align:center;
margin-top:15px;
}

.login-link a{
color:#2c3e50;
text-decoration:none;
font-weight:bold;
}

.logo{
text-align:center;
font-size:24px;
font-weight:bold;
margin-bottom:10px;
color:#2c3e50;
}

.subtitle{
text-align:center;
font-size:13px;
color:gray;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">⚖️ LexConnect</div>

<div class="subtitle">
Join our legal platform and help people solve legal problems
</div>

<h2>Lawyer Registration</h2>

{% if messages %}
{% for message in messages %}
<p style="color:red;">{{ message }}</p>
{% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<input type="text" name="username" placeholder="Create Username" required>

<input type="password" name="password" placeholder="Create Password" required>

<input type="text" name="name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<input type="text" name="location" placeholder="City / Location" required>

<input type="number" name="experience" placeholder="Years of Experience" required>

<select name="specialization" required>

<option value="">Select Specialization</option>

{% for c in categories %}

<option value="{{c.id}}">
{{c.name}}
</option>

{% endfor %}

</select>

<button type="submit">
Register as Lawyer
</button>

</form>

<div class="login-link">

Already registered?

<a href="/lawyer/login/">
Login here
</a>

</div>

</div>

</body>

</html>
