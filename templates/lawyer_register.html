{% extends 'base.html' %}
{% block title %}Lawyer Registration{% endblock %}
{% block content %}
<div class="form-shell">
    <h1 class="page-title" style="font-size:36px;">Join LexConnect as a Lawyer</h1>
    <p class="section-copy">Build your digital consultation practice with bookings, payments, and real-time chat.</p>
    {% if error %}<div class="flash-message error-message">{{ error }}</div>{% endif %}
    <form method="post" enctype="multipart/form-data" class="form-grid">
        {% csrf_token %}
        <div class="field">
            <label>Username</label>
            <input type="text" name="username" value="{{ form.username.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="field">
            <label>Full name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" value="{{ form.email.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Location</label>
            <input type="text" name="location" value="{{ form.location.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Experience (years)</label>
            <input type="number" name="experience" min="0" value="{{ form.experience.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Consultation fee</label>
            <input type="number" name="fee" min="100" step="50" value="{{ form.fee.value|default:'500' }}" required>
        </div>
        <div class="field full">
            <label>Category</label>
            <select name="category" required>
                <option value="">Select category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if form.category.value|stringformat:'s' == category.id|stringformat:'s' %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>Bar council / certification ID</label>
            <input type="text" name="certification" value="{{ form.certification.value|default:'' }}">
        </div>
        <div class="field">
            <label>Verification document</label>
            <input type="file" name="certificate_file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx">
        </div>
        <div class="field full">
            <label>Professional bio</label>
            <textarea name="bio" placeholder="Tell clients about your expertise, practice areas, and consultation style.">{{ form.bio.value|default:'' }}</textarea>
        </div>
        <div class="field full">
            <button class="btn btn-primary" type="submit">Create Lawyer Account</button>
        </div>
    </form>
</div>
{% endblock %}
