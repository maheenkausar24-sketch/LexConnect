{% extends 'base.html' %}
{% block title %}Lawyer Login{% endblock %}
{% block content %}
<div class="form-shell">
    <h1 class="page-title" style="font-size:36px;">Lawyer Login</h1>
    <p class="section-copy">Manage bookings, active chats, notifications, and online presence.</p>
    {% if error %}
    <div class="flash-message error-message" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% url 'lawyer_login' %}" class="form-grid">
        {% csrf_token %}
        <div class="field full">
            <label for="lawyer-login-username">Username or email</label>
            <input id="lawyer-login-username" type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required>
        </div>
        <div class="field full">
            <label for="lawyer-login-password">Password</label>
            <input id="lawyer-login-password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="field full">
            <button class="btn btn-primary" type="submit">Login as Lawyer</button>
        </div>
    </form>
    <p class="muted" style="margin-top:16px;"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
</div>
{% endblock %}
