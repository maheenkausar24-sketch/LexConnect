<!DOCTYPE html>
<html>

<head>
<title>Chat</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#5b6df0,#8e66f5);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.chat-container{
width:500px;
background:white;
border-radius:15px;
overflow:hidden;
}

.chat-header{
background:#5b6df0;
color:white;
padding:15px;
font-size:18px;
}

.chat-box{
height:400px;
overflow-y:auto;
padding:20px;
background:#f4f6fb;
}

.chat-input{
display:flex;
padding:10px;
border-top:1px solid #ddd;
}

.chat-input input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

.chat-input button{
margin-left:10px;
background:#5b6df0;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
}

</style>

</head>

<body>

<div class="chat-container">

<div class="chat-header">
Chat with {{ chat.lawyer.name }}
</div>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#5b6df0,#8e66f5);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.chat-container{
width:520px;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
}

.chat-header{
background:#5b6df0;
color:white;
padding:15px;
font-size:18px;
font-weight:bold;
}

.chat-box{
height:420px;
overflow-y:auto;
padding:20px;
background:#f4f6fb;
display:flex;
flex-direction:column;
}

.message{
max-width:70%;
padding:10px 15px;
margin-bottom:10px;
border-radius:12px;
font-size:14px;
}

.user-message{
background:#5b6df0;
color:white;
align-self:flex-end;
}

.lawyer-message{
background:#e4e6eb;
color:black;
align-self:flex-start;
}

.time{
font-size:10px;
opacity:0.7;
margin-top:5px;
}

.chat-input{
display:flex;
padding:12px;
border-top:1px solid #ddd;
}

.chat-input input{
flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;
}

.chat-input button{
margin-left:10px;
background:#5b6df0;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
cursor:pointer;
}

</style>

<div class="chat-box" id="chat-box">

{% for message in messages %}

{% if message.sender == request.user %}

<div class="message user-message">
{{ message.text }}
<div class="time">{{ message.created_at|time:"H:i" }}</div>
</div>

{% else %}

<div class="message lawyer-message">
{{ message.text }}
<div class="time">{{ message.created_at|time:"H:i" }}</div>
</div>

{% endif %}

{% endfor %}

</div>

<form method="POST" class="chat-input">

{% csrf_token %}

<input type="text" name="text" placeholder="Type your message..." required>

<button type="submit">Send</button>

</form>

</div>

<script>

var chatBox = document.getElementById("chat-box");

chatBox.scrollTop = chatBox.scrollHeight;

</script>

</body>
</html>
