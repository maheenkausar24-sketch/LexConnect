<!DOCTYPE html>
<html>

<head>

<title>Lawyer Profile</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#2c3e50,#4ca1af);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:40px;
width:420px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
text-align:center;
}

.name{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
}

.info{
margin:8px 0;
}

.btn{
display:inline-block;
margin-top:20px;
background:#2c3e50;
color:white;
padding:12px 18px;
border-radius:6px;
text-decoration:none;
}

.btn:hover{
background:#1a252f;
}

</style>

</head>

<body>

<div class="card">

<div class="name">⚖ {{lawyer.name}}</div>

<div class="info">
<b>Specialization:</b> {{lawyer.specialization.name}}
</div>

<div class="info">
<b>Experience:</b> {{lawyer.experience}} years
</div>

<div class="info">
<b>Location:</b> {{lawyer.location}}
</div>

<div class="info">
<b>Email:</b> {{lawyer.email}}
</div>

<div class="info">
<b>Phone:</b> {{lawyer.phone}}
</div>

<a class="btn" href="/consult/{{lawyer.id}}/">
Consult Now
</a>

</div>

</body>

</html>
