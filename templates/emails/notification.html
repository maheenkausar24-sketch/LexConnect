<!doctype html>
<html lang="en">
<body style="margin:0;background:#f4f7fb;color:#18324a;font-family:Segoe UI,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:28px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #d9e2ec;border-radius:18px;overflow:hidden;">
                    <tr>
                        <td style="padding:22px 26px;background:#0f766e;color:#ffffff;">
                            <div style="font-size:13px;font-weight:700;text-transform:uppercase;">LexConnect update</div>
                            <h1 style="margin:8px 0 0;font-size:24px;line-height:1.2;">{{ notification.title }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:26px;">
                            <p style="margin:0 0 16px;">Hello {{ recipient.get_full_name|default:recipient.username }},</p>
                            <p style="margin:0 0 24px;line-height:1.6;">{{ notification.message }}</p>
                            <a href="{{ action_url }}" style="display:inline-block;padding:12px 18px;border-radius:10px;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:700;">Open LexConnect</a>
                            <p style="margin:24px 0 0;color:#60758a;font-size:13px;line-height:1.5;">This is a demo-safe notification email. If you were not expecting it, you can ignore this message.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
