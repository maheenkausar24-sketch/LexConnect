{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="form-shell">
    <h1 class="page-title" style="font-size:36px;">Reset Password</h1>
    <p class="section-copy">Enter your account email. In local development the reset email appears in the console.</p>
    {% if error %}<div class="flash-message error-message">{{ error }}</div>{% endif %}
    <form method="post" class="form-grid">
        {% csrf_token %}
        <div class="field full">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="field full">
            <button class="btn btn-primary" type="submit">Send Reset Link</button>
        </div>
    </form>
</div>
{% endblock %}
