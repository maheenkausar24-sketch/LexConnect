{% extends 'base.html' %}
{% block title %}Choose New Password{% endblock %}
{% block content %}
<div class="form-shell">
    <h1 class="page-title" style="font-size:36px;">Choose New Password</h1>
    {% if validlink %}
        <form method="post" class="form-grid">
            {% csrf_token %}
            <div class="field full">
                <label>New password</label>
                <input type="password" name="new_password1" required>
            </div>
            <div class="field full">
                <label>Confirm password</label>
                <input type="password" name="new_password2" required>
            </div>
            <div class="field full">
                <button class="btn btn-primary" type="submit">Update Password</button>
            </div>
        </form>
    {% else %}
        <p class="section-copy">This password reset link is invalid or expired.</p>
        <a class="btn btn-secondary" href="{% url 'password_reset' %}">Request New Link</a>
    {% endif %}
</div>
{% endblock %}
