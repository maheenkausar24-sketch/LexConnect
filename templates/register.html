{% extends 'base.html' %}
{% block title %}Client Registration{% endblock %}
{% block content %}
<div class="form-shell">
    <h1 class="page-title" style="font-size:36px;">Create Client Account</h1>
    <p class="section-copy">Start booking consultations and chat with expert lawyers.</p>
    {% if error %}<div class="flash-message error-message">{{ error }}</div>{% endif %}
    <form method="post" class="form-grid">
        {% csrf_token %}
        <div class="field">
            <label>Username</label>
            <input type="text" name="username" value="{{ form.username.value|default:'' }}" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" value="{{ form.email.value|default:'' }}" required>
        </div>
        <div class="field full">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="field full">
            <button class="btn btn-primary" type="submit">Create Account</button>
        </div>
    </form>
</div>
{% endblock %}
