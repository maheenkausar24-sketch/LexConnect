services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 lexconnect.asgi:application
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,web"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
      LEXCONNECT_ASYNC_EMAIL: "True"
      LEXCONNECT_ASYNC_NOTIFICATIONS: "True"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A lexconnect worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A lexconnect beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
