services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 lexconnect.asgi:application
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,web"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
      LEXCONNECT_ASYNC_EMAIL: "True"
      LEXCONNECT_ASYNC_NOTIFICATIONS: "True"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A lexconnect worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    build: .
    command: celery -A lexconnect beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexconnect.settings
      DJANGO_DEBUG: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  staticfiles:
  media:
  redis-data:
