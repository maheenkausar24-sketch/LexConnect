name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py check

      - name: Migration check
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py makemigrations --check --dry-run

      - name: Applied migration check
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py migrate --check

      - name: Celery configuration check
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py validate_celery

      - name: Deployment diagnostics
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py deployment_diagnostics

      - name: Production smoke test
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py production_smoke_test --skip-deploy-check

      - name: Retention cleanup dry run
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py cleanup_operational_records --dry-run

      - name: Tests
        env:
          DJANGO_DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: python manage.py test
